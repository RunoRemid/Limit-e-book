<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Limit · Deneme Günlüğü Koşumu</title></head><body>
<div id="bildirimAlani"></div>
<h1 style="font:600 20px system-ui">Aşama 1 · Yerel deneme günlüğü</h1>
<pre id="sonuc" style="font:13px ui-monospace,Consolas,monospace;line-height:1.7">çalışıyor…</pre>

<script src="../yapilandirma.js"></script>
<script src="../data/veri.js"></script>
<script src="../src/cekirdek.js"></script>
<script src="../src/veri-servis.js"></script>
<script src="../src/analitik.js"></script>
<script src="../src/ai-sokratik.js"></script>
<script src="../src/istatistik.js"></script>
<script>
(function () {
  var cikti = [], sayac = 0;
  function kontrol(ad, kosul) { sayac++; cikti.push((kosul ? 'GECTI  ' : 'KALDI  ') + ad); }

  Limit.veri.baglat();
  Limit.analitik.baglat();

  /* Temiz baslangic */
  Limit.depo.denemeGunluguSil();
  kontrol('gunluk bos baslatildi', Limit.depo.denemeGunlugu().length === 0);

  /* --- Birkac soru cozulmus gibi davran ------------------------
     Gercek akisin yaydigi olayin ayni bicimi kullaniliyor. */
  function denemeYap(soruId, secim, denemeNo, sureSn, kademe) {
    var soru = Limit.veri.soru(soruId);
    if (kademe) Limit.depo.ilerlemeYaz(soruId, { ipucuKademe: kademe }, true);
    var v = {
      soru: soru,
      secim: secim,
      dogruMu: soru.dogru ? (secim === soru.dogru) : null,
      sureSn: sureSn,
      denemeNo: denemeNo,
      cozuldu: soru.dogru ? (secim === soru.dogru) : false
    };
    var kayit = Limit.analitik.denemeKaydi(v);
    Limit.depo.denemeEkle(kayit);
    return kayit;
  }

  /* FIZ-T3-S3 dogru sik D · once yanlis sonra dogru */
  var y1 = denemeYap('FIZ-T3-S3', 'A', 1, 34, 0);
  var d1 = denemeYap('FIZ-T3-S3', 'D', 2, 61, 0);
  /* KIM-T6-S7 dogru sik C · ilk denemede, kocla */
  var d2 = denemeYap('KIM-T6-S7', 'C', 1, 88, 2);
  /* MAT-T6-S10 dogru sik C · ilk denemede, kocsuz */
  var d3 = denemeYap('MAT-T6-S10', 'C', 1, 45, 0);

  kontrol('4 deneme gunluge yazildi', Limit.depo.denemeGunlugu().length === 4);

  /* --- Alan butunlugu ---------------------------------------- */
  var gerekli = ['oturum','zaman','soru_id','sayfa_id','brans','konu','unite','soru_no',
                 'zorluk','secim','dogru_sik','dogru_mu','sure_sn','deneme_no',
                 'ilk_denemede','koc_yardimi','anahtar_kaynagi'];
  kontrol('tum zorunlu alanlar var',
    gerekli.every(function (a) { return a in d1; }));

  kontrol('konu adi yaziliyor', d1.konu === 'Vektörler - III');
  kontrol('unite yaziliyor', typeof d1.unite === 'string' && d1.unite.length > 3);
  kontrol('zorluk yaziliyor', d1.zorluk >= 1 && d1.zorluk <= 3);
  kontrol('dogru sik yaziliyor (celdirici analizi icin)', d1.dogru_sik === 'D');
  kontrol('zaman damgasi ISO', /^\d{4}-\d{2}-\d{2}T/.test(d1.zaman));
  kontrol('oturum kimligi UUID', /^[0-9a-f-]{36}$/i.test(d1.oturum));
  kontrol('tum kayitlarda ayni oturum',
    Limit.depo.denemeGunlugu().every(function (k) { return k.oturum === d1.oturum; }));

  /* --- Deneme mantigi ---------------------------------------- */
  kontrol('yanlis deneme dogru_mu=false', y1.dogru_mu === false);
  kontrol('yanlis denemede ilk_denemede NULL (oran bozulmasin)', y1.ilk_denemede === null);
  kontrol('2. denemede dogru → ilk_denemede=false', d1.ilk_denemede === false);
  kontrol('1. denemede dogru → ilk_denemede=true', d3.ilk_denemede === true);
  kontrol('deneme_no artiyor', y1.deneme_no === 1 && d1.deneme_no === 2);
  kontrol('koc yardimi alinmissa true', d2.koc_yardimi === true);
  kontrol('koc yardimi alinmamissa false', d3.koc_yardimi === false);
  kontrol('sure saniye olarak kaydedildi', d1.sure_sn === 61);

  /* --- Panelin ihtiyac duydugu turetmeler --------------------- */
  var g = Limit.depo.denemeGunlugu();
  var cozumler = g.filter(function (k) { return k.dogru_mu === true; });
  kontrol('cozulen soru sayisi turetilebilir', cozumler.length === 3);

  var ilkDenemede = cozumler.filter(function (k) { return k.ilk_denemede === true; }).length;
  kontrol('ilk denemede oran turetilebilir',
    Math.round(100 * ilkDenemede / cozumler.length) === 67);

  var konular = {};
  g.forEach(function (k) { konular[k.konu] = true; });
  kontrol('konu bazinda gruplanabilir', Object.keys(konular).length === 3);

  var yanlislar = g.filter(function (k) { return k.dogru_mu === false; });
  kontrol('celdirici analizi icin veri var',
    yanlislar.length === 1 && yanlislar[0].secim === 'A' && yanlislar[0].dogru_sik === 'D');

  /* --- Tavan ------------------------------------------------- */
  kontrol('tavan tanimli', Limit.DENEME_TAVANI === 500);
  for (var i = 0; i < 520; i++) denemeYap('MAT-T6-S10', 'C', 1, 30, 0);
  kontrol('tavan asilinca eski kayitlar dusuyor',
    Limit.depo.denemeGunlugu().length === 500);

  /* --- Panelin TEK veri kaynagi (gerileme testi) ---------------
     Hata: demo kipi gercek gunlugu SILIP yerine ornek kayit
     yaziyordu; kartlar ile grafikler farkli toplam gosteriyor ve
     ogrencinin gercek gecmisi yok oluyordu. */
  (function () {
    var oncekiUzunluk = Limit.depo.denemeGunlugu().length;

    /* Demo verisi bellekte; depoya dokunmamali */
    Limit.demoVeri = [
      { soru_id: 'X-1', konu: 'Deneme Konusu', brans: 'fizik', zorluk: 1,
        secim: 'A', dogru_sik: 'A', dogru_mu: true, sure_sn: 10,
        deneme_no: 1, koc_yardimi: false, zaman: '2026-08-20T10:00:00.000Z' },
      { soru_id: 'X-2', konu: 'Deneme Konusu', brans: 'fizik', zorluk: 1,
        secim: 'B', dogru_sik: 'C', dogru_mu: false, sure_sn: 20,
        deneme_no: 1, koc_yardimi: false, zaman: '2026-08-20T10:01:00.000Z' }
    ];

    kontrol('kaynak: demo aciksa aktifGunluk demo verisini verir',
      Limit.istatistik.aktifGunluk().length === 2);
    kontrol('kaynak: demo kipi DEPOYA dokunmuyor',
      Limit.depo.denemeGunlugu().length === oncekiUzunluk);

    /* Kart ile grafik ayni diziden beslenince toplamlar esit olmali */
    var g = Limit.istatistik.aktifGunluk();
    var o = Limit.istatistik.ozet(g);
    var k = Limit.istatistik.konular(g);
    var konuToplami = k.reduce(function (t, x) { return t + x.denenen; }, 0);
    kontrol('kaynak: ozet ve konular ayni toplami veriyor',
      o.denenenSoru === konuToplami && konuToplami === 2);

    /* Yuzde her zaman sonlu bir sayi olmali — kart "%" basmasin */
    kontrol('olcut: ilkDenemeYuzde sonlu sayi',
      typeof o.ilkDenemeYuzde === 'number' && isFinite(o.ilkDenemeYuzde));
    kontrol('olcut: bos gunlukte de yuzde sonlu',
      isFinite(Limit.istatistik.ozet([]).ilkDenemeYuzde));

    delete Limit.demoVeri;
    kontrol('kaynak: demo kapaninca gercek gunluge donuyor',
      Limit.istatistik.aktifGunluk().length === oncekiUzunluk);
  })();


  /* --- Aşama 3 ekleri: hız–isabet ve gelişim -------------------
     Ölçütler yalnızca istatistik.js'te tanımlı; buradaki kontroller
     tanımın kaymadığını ve toplamların kartla tuttuğunu kovalar. */
  (function () {
    var I = Limit.istatistik;

    /* Kurgu günlük: gün ve süre değerleri elle seçildi ki bölge ve
       ortanca beklenen yere düşsün. gunOfset gün cinsinden gerilik. */
    function k(soruId, konu, secim, dogru, denemeNo, sure, koc, gunOnce) {
      var t = new Date();
      t.setDate(t.getDate() - gunOnce);
      t.setHours(12, 0, 0, 0);
      return {
        oturum: 'test', zaman: t.toISOString(),
        soru_id: soruId, konu: konu, brans: 'fizik', zorluk: 2,
        secim: secim, dogru_sik: dogru, dogru_mu: secim === dogru,
        sure_sn: sure, deneme_no: denemeNo, koc_yardimi: !!koc
      };
    }

    /* HIZLI+İSABETLİ konu: 3 soru, hepsi ilk denemede, 30 sn
       YAVAŞ+İSABETSİZ konu: 3 soru, hiçbiri ilk denemede, ~150 sn
       AZ VERİ konu: tek soru                                     */
    var G = [
      k('H1', 'Hizli Konu', 'A', 'A', 1, 30, false, 4),
      k('H2', 'Hizli Konu', 'A', 'A', 1, 28, false, 4),
      k('H3', 'Hizli Konu', 'A', 'A', 1, 32, false, 3),

      k('Y1', 'Yavas Konu', 'B', 'C', 1, 100, false, 2),
      k('Y1', 'Yavas Konu', 'C', 'C', 2, 160, true, 2),
      k('Y2', 'Yavas Konu', 'B', 'C', 1, 100, false, 1),
      k('Y2', 'Yavas Konu', 'C', 'C', 2, 162, true, 1),
      k('Y3', 'Yavas Konu', 'B', 'C', 1, 100, false, 1),
      k('Y3', 'Yavas Konu', 'C', 'C', 2, 158, true, 1),

      k('T1', 'Tek Soruluk Konu', 'A', 'A', 1, 40, false, 0)
    ];

    /* --- Eşikler ---------------------------------------------- */
    var hi = I.hizIsabet(G);
    kontrol('hiz-isabet: isabet esigi sabit %50', hi.esikIsabet === 50);
    kontrol('hiz-isabet: iki saglam konu varsa esik ORTANCA', hi.yontem === 'ortanca');
    /* Saglam konular: Hizli (30 sn) ve Yavas (160 sn) → ortanca 95.
       Tek soruluk konu (40 sn) esige KARISMAMALI; karissaydi
       ortanca 40 olur, yavas konu daha da uca savrulurdu.
       95 bilinerek secildi: sabit yedek 90 ile karismasin. */
    kontrol('hiz-isabet: esik yalnizca saglam konulardan hesaplandi',
      hi.esikSure === 95);

    var bul = {};
    hi.noktalar.forEach(function (n) { bul[n.konu] = n; });

    kontrol('hiz-isabet: hizli+isabetli konu "guclu" bolgesinde',
      bul['Hizli Konu'].bolge === 'guclu' &&
      bul['Hizli Konu'].bolgeAdi === 'Hızlı ve isabetli');
    kontrol('hiz-isabet: yavas+isabetsiz konu "kavram" bolgesinde',
      bul['Yavas Konu'].bolge === 'kavram' &&
      bul['Yavas Konu'].bolgeAdi === 'Kavram eksiği');
    kontrol('hiz-isabet: az veri konusu isaretli',
      bul['Tek Soruluk Konu'].yeterliOrneklem === false);

    /* Kart ile grafik celismesin: haritadaki isabet degeri, konu
       tablosundaki ilkDenemeYuzde ile AYNI alandan gelmeli. */
    var konuHarita = {};
    I.konular(G).forEach(function (x) { konuHarita[x.konu] = x; });
    kontrol('hiz-isabet: isabet degeri konu tablosuyla ayni',
      hi.noktalar.every(function (n) {
        return n.isabet === konuHarita[n.konu].ilkDenemeYuzde &&
               n.sure === konuHarita[n.konu].ortalamaSure;
      }));

    /* Ortanca hesaplanamayacak kadar az konu → sabit yedek */
    var tek = I.hizIsabet([G[0], G[1], G[2]]);
    kontrol('hiz-isabet: tek konu varken sabit yedege dusuluyor',
      tek.yontem === 'sabit' && tek.esikSure === I.HIZ_ESIGI_YEDEK);
    kontrol('hiz-isabet: tek konu harita icin yetersiz', tek.yeterli === false);
    kontrol('hiz-isabet: bos gunluk cokmuyor',
      I.hizIsabet([]).noktalar.length === 0 && I.hizIsabet([]).yeterli === false);

    /* Sınırda duran konu: ortancaya TAM EŞİT süre yavaş sayılmamalı.
       Üç saglam konu 30 / 90 / 150 → ortanca 90; ortadaki konu tam
       sınırda. Isabeti %100 oldugu icin "guclu" olmali, "yavas" degil. */
    var sinir = [
      k('S1', 'Sinir Konu', 'A', 'A', 1, 90, false, 2),
      k('S2', 'Sinir Konu', 'A', 'A', 1, 90, false, 2),
      k('S3', 'Sinir Konu', 'A', 'A', 1, 90, false, 2),
      k('P1', 'Cok Yavas', 'A', 'A', 1, 150, false, 1),
      k('P2', 'Cok Yavas', 'A', 'A', 1, 150, false, 1),
      k('P3', 'Cok Yavas', 'A', 'A', 1, 150, false, 1)
    ].concat([G[0], G[1], G[2]]);
    var sh = I.hizIsabet(sinir);
    var sinirNokta = sh.noktalar.filter(function (n) {
      return n.konu === 'Sinir Konu';
    })[0];
    kontrol('hiz-isabet: sinir konusu ortancaya esit', sinirNokta.sure === sh.esikSure);
    kontrol('hiz-isabet: ortancaya esit sure YAVAS sayilmiyor',
      sinirNokta.hizli === true && sinirNokta.bolge === 'guclu');

    /* --- Gelişim ---------------------------------------------- */
    var gl = I.gelisim(G);
    kontrol('gelisim: gunler eskiden yeniye sirali',
      gl.gunler.map(function (x) { return x.gun; }).join() ===
      gl.gunler.map(function (x) { return x.gun; }).slice().sort().join());

    /* EN ÖNEMLİSİ: her soru ILK denendigi gune yazildigi icin
       gunlerin toplami ozet kartindaki "denenen soru" ile birebir
       tutmali — kart ile grafik asla celismesin. */
    var gunToplami = gl.gunler.reduce(function (t, x) { return t + x.denenen; }, 0);
    kontrol('gelisim: gun toplamlari ozet kartiyla birebir tutuyor',
      gunToplami === I.ozet(G).denenenSoru && gunToplami === 7);
    kontrol('gelisim: ilk denemede toplami da tutuyor',
      gl.gunler.reduce(function (t, x) { return t + x.ilkDenemede; }, 0) ===
      I.ozet(G).ilkDenemedeSoru);

    kontrol('gelisim: az veri gunu isaretleniyor',
      gl.gunler.some(function (x) { return x.azVeri === true; }));
    kontrol('gelisim: yuzde her gunde sonlu sayi',
      gl.gunler.every(function (x) {
        return typeof x.ilkDenemeYuzde === 'number' && isFinite(x.ilkDenemeYuzde);
      }));

    /* Tek gün → nazik mesaj; trend cizilmemeli */
    /* H1 ve H2 ayni gune ait; G[2] bir gun sonrasindadir. */
    var birGun = I.gelisim([G[0], G[1]]);
    kontrol('gelisim: tek gun trend icin yetersiz',
      birGun.yeterli === false && birGun.gunSayisi === 1);
    kontrol('gelisim: bos gunluk cokmuyor',
      I.gelisim([]).yeterli === false && I.gelisim([]).gunSayisi === 0);

    /* Gün sınırı YEREL saate göre: 23:30'da çözülen soru ertesi güne
       kaymamalı (ISO damgasının ilk 10 hanesi UTC gününü verir). */
    var gece = new Date(); gece.setDate(gece.getDate() - 1); gece.setHours(23, 30, 0, 0);
    var sabah = new Date(); sabah.setDate(sabah.getDate() - 1); sabah.setHours(8, 0, 0, 0);
    var geceGunluk = [
      { soru_id: 'N1', konu: 'K', dogru_mu: true, deneme_no: 1, koc_yardimi: false,
        sure_sn: 20, zaman: sabah.toISOString() },
      { soru_id: 'N2', konu: 'K', dogru_mu: true, deneme_no: 1, koc_yardimi: false,
        sure_sn: 20, zaman: gece.toISOString() }
    ];
    kontrol('gelisim: gun siniri yerel saate gore ciziliyor',
      I.gelisim(geceGunluk).gunSayisi === 1);
  })();
  /* --- Kaliciligi dogrula ------------------------------------
     Depo yazimi 220ms geciktirmelidir (debounce); esanli kontrol
     erken kalir. Debounce'un gecmesini bekliyoruz. */
  setTimeout(function () {
    var ham = window.localStorage.getItem(Limit.DEPO_ANAHTARI);
    kontrol('gunluk localStorage a yaziliyor (debounce sonrasi)',
      !!ham && ham.indexOf('denemeGunlugu') > -1);

    var cozumlendi = null;
    try { cozumlendi = JSON.parse(ham); } catch (h) {}
    kontrol('diskteki gunluk okunabilir ve dolu',
      !!cozumlendi && Array.isArray(cozumlendi.denemeGunlugu) &&
      cozumlendi.denemeGunlugu.length === 500);

    /* Temizlik: koşum kendi verisini birakmasin */
    Limit.depo.denemeGunluguSil();
    kontrol('temizlik yapildi', Limit.depo.denemeGunlugu().length === 0);

    var kaldi = cikti.filter(function (c) { return c.indexOf('KALDI') === 0; }).length;
    cikti.push('');
    cikti.push('TOPLAM: ' + sayac + ' kontrol · KALAN: ' + kaldi);
    document.getElementById('sonuc').textContent = cikti.join('\n');
  }, 400);
})();
</script>
</body></html>
